    <script>
      // Early guard against extension-injected errors like MetaMask in sandboxed iframes
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        if (msg.indexOf('MetaMask') !== -1 || msg.indexOf('ResizeObserver') !== -1 || msg.indexOf('ethereum') !== -1) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
        if (reason.indexOf('MetaMask') !== -1 || reason.indexOf('ResizeObserver') !== -1 || reason.indexOf('ethereum') !== -1) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
        }
      });
    </script>
